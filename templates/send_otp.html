<!DOCTYPE html>
<html>
<head>
    <title>Send OTP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script>
    (function() {
        var saved = localStorage.getItem('theme') || 'light';
        if (saved === 'dark') {
            document.documentElement.classList.add('dark-theme');
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <a href="/login" class="back-btn-global mb-3">
                <i class="bi bi-arrow-left"></i> Back to Login
            </a>
            <div class="card login-card shadow-lg">
                <div class="login-header">
                    <i class="bi bi-envelope-at-fill fs-1" style="color: #4e73df;"></i>
                    <h2>Gmail / Email OTP Login</h2>
                    <p>Enter your Gmail address below to receive a secure 6-digit OTP verification code</p>
                </div>

                <div class="form-body">
                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <form method="POST" action="/auth/otp/send">
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" name="email" id="email" class="form-control" placeholder="name@example.com" required>
                        </div>

                        <button type="submit" class="btn btn-login w-100 text-white mb-3">
                            Send OTP
                        </button>
                        
                        <div class="text-center">
                            <a href="/login" class="text-decoration-none" style="color: #4e73df; font-weight: 500;">
                                <i class="bi bi-arrow-left"></i> Back to Login
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

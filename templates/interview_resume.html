<!DOCTYPE html>
<html>
<head>
    <title>Resume Interview</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
{% include 'navbar.html' %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow p-4 text-center">
                <h4 class="mb-3">You have an interview in progress</h4>
                <p class="text-muted">Would you like to continue where you left off, or start a fresh interview?</p>
                <a href="/interview?resume=yes" class="btn btn-primary mb-2">Resume Interview</a>
                <a href="/interview?resume=no" class="btn btn-outline-danger">Start New Interview</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>

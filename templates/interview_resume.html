<!DOCTYPE html>
<html lang="en" class="dark-theme">
<head>
    <title>Resume Interview â€” AI Interview Platform</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="You have an interview in progress. Choose to resume or start a fresh interview.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script>
    (function() {
        document.documentElement.classList.add('dark-theme');
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
    })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root {
            --page-bg:    #f0f4ff;
            --page-glow:  rgba(59, 130, 246, 0.07);
            --card-bg:    #ffffff;
            --card-border: rgba(0, 0, 0, 0.07);
            --card-shadow: 0 20px 50px rgba(37, 99, 235, 0.08);
            --heading-color: #0f172a;
            --body-color: #475569;
        }

        html.dark-theme {
            --page-bg:    #0b0f19;
            --page-glow:  rgba(59, 130, 246, 0.06);
            --card-bg:    rgba(10, 15, 29, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            --heading-color: #f0f6ff;
            --body-color:  #8aa4cc;
        }

        body {
            min-height: 100vh;
            
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        

        .container { position: relative; z-index: 1; }

        .resume-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: var(--card-shadow);
            transition: border-color 0.3s, background-color 0.25s;
            animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .resume-card:hover {
            border-color: rgba(59, 130, 246, 0.25);
        }

        .resume-icon {
            width: 72px; height: 72px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(245, 158, 11, 0.05));
            border: 1px solid rgba(245, 158, 11, 0.25);
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem;
            color: #d97706;
            margin: 0 auto 1.25rem;
        }

        html.dark-theme .resume-icon {
            background: rgba(245, 158, 11, 0.12);
            border-color: rgba(245, 158, 11, 0.20);
            color: #fbbf24;
        }

        .resume-card h4 {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.35rem;
            color: var(--heading-color);
            margin-bottom: 0.6rem;
            letter-spacing: -0.02em;
        }

        .resume-card p {
            color: var(--body-color);
            font-size: 0.93rem;
            margin-bottom: 1.6rem;
            line-height: 1.6;
        }

        .btn-resume-action {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            border-radius: 12px;
            padding: 12px 22px;
            font-size: 0.92rem;
            transition: all 0.18s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            letter-spacing: 0.01em;
        }

        .btn-resume-primary {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #fff;
            border: none;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }

        .btn-resume-primary:hover {
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(37, 99, 235, 0.4);
            filter: brightness(1.05);
        }

        .btn-resume-danger {
            background: transparent;
            color: #ef4444;
            border: 1.5px solid rgba(239, 68, 68, 0.35);
        }

        .btn-resume-danger:hover {
            background: rgba(239, 68, 68, 0.07);
            border-color: #ef4444;
            color: #dc2626;
            transform: translateY(-1px);
        }

        html.dark-theme .btn-resume-danger {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.35);
        }

        html.dark-theme .btn-resume-danger:hover {
            background: rgba(248, 113, 113, 0.10);
            border-color: #f87171;
            color: #fca5a5;
        }
    </style>
</head>
<body>
{% include 'navbar.html' %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="resume-card">
                <div class="resume-icon">
                    <i class="bi bi-clock-history"></i>
                </div>
                <h4>Interview In Progress</h4>
                <p>You have an interview session in progress. Would you like to continue where you left off, or start a fresh interview?</p>
                <div class="d-flex flex-column gap-3">
                    <a href="/interview?resume=yes" class="btn-resume-action btn-resume-primary justify-content-center">
                        <i class="bi bi-play-fill"></i> Resume Interview
                    </a>
                    <a href="/interview?resume=no" class="btn-resume-action btn-resume-danger justify-content-center">
                        <i class="bi bi-arrow-counterclockwise"></i> Start New Interview
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

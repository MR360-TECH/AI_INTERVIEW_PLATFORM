<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script>
    (function() {
        var saved = localStorage.getItem('theme') || 'light';
        if (saved === 'dark') {
            document.documentElement.classList.add('dark-theme');
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .otp-input {
            width: 48px;
            height: 52px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 700;
            border-radius: 8px;
            border: 1px solid #ced4da;
        }
        .otp-input:focus {
            border-color: #4e73df;
            box-shadow: 0 0 0 0.25rem rgba(78, 115, 223, 0.25);
            outline: none;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <a href="/auth/otp/send" class="back-btn-global">
                    <i class="bi bi-arrow-left"></i> Change Email
                </a>
                <a href="/login" class="text-decoration-none text-muted fw-semibold fs-7">
                    <i class="bi bi-box-arrow-in-right"></i> Login Page
                </a>
            </div>

            <div class="card login-card shadow-lg">
                <div class="login-header text-center">
                    <i class="bi bi-shield-lock-fill fs-1" style="color: #4e73df;"></i>
                    <h2>Verify OTP</h2>
                    <p class="mb-1">Enter the 6-digit verification code sent to:</p>
                    <p class="fw-bold text-dark">{{ email }}</p>
                </div>

                <div class="form-body">
                    <!-- Error Alert -->
                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <form method="POST" action="/auth/otp/verify" id="otpForm">
                        
                        <div class="mb-4">
                            <label class="form-label d-block text-center mb-3">6-Digit Code</label>
                            <div class="d-flex justify-content-between px-2">
                                <input type="text" class="otp-input form-control" maxlength="1" pattern="\d" required autofocus>
                                <input type="text" class="otp-input form-control" maxlength="1" pattern="\d" required>
                                <input type="text" class="otp-input form-control" maxlength="1" pattern="\d" required>
                                <input type="text" class="otp-input form-control" maxlength="1" pattern="\d" required>
                                <input type="text" class="otp-input form-control" maxlength="1" pattern="\d" required>
                                <input type="text" class="otp-input form-control" maxlength="1" pattern="\d" required>
                            </div>
                        </div>

                        <!-- Combined single 'otp' input sent to request.form.get("otp") -->
                        <input type="hidden" name="otp" id="fullOtp">

                        <button type="submit" class="btn btn-login w-100 text-white mb-3">
                            Verify & Proceed
                        </button>
                        
                        <div class="d-flex justify-content-between align-items-center">
                            <a href="/auth/otp/send" class="text-decoration-none" style="color: #4e73df; font-weight: 500;">
                                <i class="bi bi-pencil-square"></i> Change Gmail
                            </a>
                            <a href="/auth/otp/send" class="text-decoration-none" style="color: #4e73df; font-weight: 500;">
                                <i class="bi bi-arrow-clockwise"></i> Resend Code
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const inputs = document.querySelectorAll('.otp-input');
    const hiddenOtpField = document.getElementById('fullOtp');
    const form = document.getElementById('otpForm');

    inputs.forEach((input, index) => {
        // Auto-tab next
        input.addEventListener('input', (e) => {
            if (e.target.value.length === 1 && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }
        });

        // Backspace focus previous
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !e.target.value && index > 0) {
                inputs[index - 1].focus();
            }
            // Enter key: aggregate and submit
            if (e.key === 'Enter') {
                e.preventDefault();
                let combined = '';
                inputs.forEach(inp => combined += inp.value);
                hiddenOtpField.value = combined;
                form.submit();
            }
        });

        // Paste 6-digit code
        input.addEventListener('paste', (e) => {
            const pastedData = e.clipboardData.getData('text').trim();
            if (/^\d{6}$/.test(pastedData)) {
                e.preventDefault();
                pastedData.split('').forEach((char, i) => {
                    if (inputs[i]) inputs[i].value = char;
                });
                inputs[inputs.length - 1].focus();
            }
        });
    });

    // Merge individual input values before submitting
    form.addEventListener('submit', () => {
        let combined = '';
        inputs.forEach(input => combined += input.value);
        hiddenOtpField.value = combined;
    });
</script>
</body>
</html>

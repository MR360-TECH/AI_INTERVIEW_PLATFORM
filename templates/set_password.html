<!DOCTYPE html>
<html lang="en" class="dark-theme">
<head>
    <title>Set Password - AI Interview Platform</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script>
    (function() {
        document.documentElement.classList.add('dark-theme');
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
    })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root {
            --su-bg: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 50%, #f0f9ff 100%);
            --su-glow: rgba(16, 185, 129, 0.08);
            --su-card-bg: #ffffff;
            --su-card-border: rgba(16, 185, 129, 0.18);
            --su-card-shadow: 0 25px 60px rgba(16, 185, 129, 0.10);
            --su-input-bg: #f0fdf4;
            --su-input-border: rgba(16, 185, 129, 0.25);
            --su-input-color: #0f172a;
            --su-input-focus-bg: #ffffff;
            --su-label: #134e4a;
            --su-muted: #475569;
            --su-link: #059669;
        }
        html.dark-theme {
            --su-bg: linear-gradient(135deg, #061a13 0%, #0a1628 100%);
            --su-glow: rgba(16, 185, 129, 0.06);
            --su-card-bg: rgba(15, 40, 30, 0.65);
            --su-card-border: rgba(16, 185, 129, 0.25);
            --su-card-shadow: 0 25px 60px rgba(0,0,0,0.4);
            --su-input-bg: rgba(6, 26, 19, 0.7);
            --su-input-border: rgba(16, 185, 129, 0.2);
            --su-input-color: #f0fdf4;
            --su-input-focus-bg: rgba(6, 26, 19, 0.9);
            --su-label: #a7f3d0;
            --su-muted: #94a3b8;
            --su-link: #34d399;
        }

        body {
            min-height: 100vh;
            
            display: flex; align-items: center; justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 2rem 1rem;
            transition: background 0.3s;
        }

        .signup-wrap { width: 100%; max-width: 480px; }

        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--su-muted); font-size: 0.85rem; font-weight: 600;
            text-decoration: none; font-family: 'Outfit', sans-serif;
            background: var(--su-card-bg); border: 1px solid var(--su-card-border);
            padding: 7px 16px; border-radius: 10px;
            transition: all 0.2s; margin-bottom: 1.2rem;
        }
        .back-link:hover { color: var(--su-link); border-color: var(--su-link); transform: translateY(-1px); }

        .su-card {
            background: var(--su-card-bg);
            border: 1.5px solid var(--su-card-border);
            border-radius: 28px;
            box-shadow: var(--su-card-shadow);
            overflow: hidden;
            animation: slideUp 0.45s cubic-bezier(0.22,1,0.36,1) both;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .su-header {
            background: linear-gradient(135deg, #059669, #0891b2);
            padding: 2.2rem 2rem 1.8rem;
            text-align: center;
        }
        .su-icon-ring {
            width: 68px; height: 68px; border-radius: 50%;
            background: rgba(255,255,255,0.18);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 2rem; color: #fff;
            margin-bottom: 0.9rem;
            box-shadow: 0 0 0 10px rgba(255,255,255,0.06);
        }
        .su-header h1 {
            font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 1.6rem;
            color: #fff; margin-bottom: 0.2rem; letter-spacing: -0.02em;
        }
        .su-header p { color: rgba(255,255,255,0.88); font-size: 0.9rem; margin: 0; }
        .su-header .email-tag {
            display: inline-block; margin-top: 0.5rem;
            background: rgba(255,255,255,0.2); border-radius: 6px;
            padding: 3px 10px; font-size: 0.88rem; font-weight: 700; color: #fff;
        }

        .su-body { padding: 2rem 2.2rem 2.4rem; }

        .su-label {
            font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 0.78rem;
            text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--su-label); margin-bottom: 0.45rem;
            display: flex; align-items: center; gap: 5px;
        }

        .su-input {
            width: 100%;
            background: var(--su-input-bg) !important;
            border: 1.5px solid var(--su-input-border) !important;
            border-radius: 12px !important;
            color: var(--su-input-color) !important;
            font-size: 0.96rem;
            padding: 0.75rem 1.1rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        .su-input:focus {
            border-color: #10b981 !important;
            box-shadow: 0 0 0 3px rgba(16,185,129,0.18) !important;
            background: var(--su-input-focus-bg) !important;
        }

        .strength-bar { height: 4px; border-radius: 99px; background: #e2e8f0; margin-top: 0.5rem; overflow: hidden; }
        .strength-fill { height: 100%; border-radius: 99px; transition: width 0.3s, background 0.3s; width: 0; }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #059669 0%, #0891b2 100%);
            border: none; border-radius: 12px; color: #fff;
            font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.05rem;
            padding: 0.88rem 2rem; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 20px rgba(5,150,105,0.35);
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            margin-top: 1.4rem;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(5,150,105,0.45); }

        .su-error {
            background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
            border-radius: 10px; padding: 0.7rem 1rem; color: #ef4444;
            font-size: 0.88rem; display: flex; align-items: center; gap: 8px;
            margin-bottom: 1.2rem;
        }

        .steps-indicator { display: flex; align-items: center; justify-content: center; margin-bottom: 1.5rem; }
        .step-dot {
            width: 28px; height: 28px; border-radius: 50%;
            font-size: 0.75rem; font-weight: 800; font-family: 'Outfit', sans-serif;
            display: flex; align-items: center; justify-content: center;
            background: rgba(16,185,129,0.15); color: #10b981; border: 2px solid #10b981;
        }
        .step-dot.active { background: #10b981; color: #fff; }
        .step-dot.done { background: #d1fae5; color: #059669; border-color: #059669; }
        .step-line { width: 36px; height: 2px; background: rgba(16,185,129,0.25); }
        .step-line.done { background: #10b981; }

        /* ══ GOATED BG OVERRIDES ══ */
        html.dark-theme body {
            background: #020510 !important;
            background-image: none !important;
        }
        .db-bg {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none; overflow: hidden; display: none;
        }
        html.dark-theme .db-bg { display: block; }
        .db-bg::before {
            content: ''; position: absolute; inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 15% 20%, rgba(0,150,255,0.18) 0%, transparent 55%),
                radial-gradient(ellipse 60% 50% at 85% 10%, rgba(100,0,255,0.14) 0%, transparent 50%),
                radial-gradient(ellipse 70% 55% at 50% 100%, rgba(0,255,220,0.10) 0%, transparent 55%),
                radial-gradient(ellipse 50% 40% at 90% 80%, rgba(0,80,255,0.12) 0%, transparent 50%),
                linear-gradient(160deg,#02060f 0%,#010416 30%,#020820 60%,#010512 100%);
        }
        .db-orb { position:absolute; border-radius:50%; filter:blur(80px); opacity:0; animation:orbDrift 18s ease-in-out infinite; }
        .db-orb-1 { width:520px;height:520px;top:-120px;left:-100px;background:radial-gradient(circle,rgba(0,120,255,0.30) 0%,transparent 70%);animation-delay:0s;animation-duration:20s; }
        .db-orb-2 { width:400px;height:400px;top:10%;right:-80px;background:radial-gradient(circle,rgba(120,0,255,0.22) 0%,transparent 70%);animation-delay:-7s;animation-duration:24s; }
        .db-orb-3 { width:480px;height:480px;bottom:-80px;left:30%;background:radial-gradient(circle,rgba(0,200,255,0.18) 0%,transparent 70%);animation-delay:-13s;animation-duration:22s; }
        .db-orb-4 { width:300px;height:300px;top:45%;right:25%;background:radial-gradient(circle,rgba(60,0,180,0.16) 0%,transparent 70%);animation-delay:-4s;animation-duration:19s; }
        .db-orb-5 { width:350px;height:350px;bottom:10%;right:-50px;background:radial-gradient(circle,rgba(0,255,180,0.12) 0%,transparent 70%);animation-delay:-9s;animation-duration:26s; }
        @keyframes orbDrift {
            0%   { opacity:0.6; transform:translate(0,0) scale(1); }
            25%  { opacity:0.8; transform:translate(30px,-20px) scale(1.05); }
            50%  { opacity:0.55; transform:translate(-20px,30px) scale(0.97); }
            75%  { opacity:0.75; transform:translate(15px,10px) scale(1.03); }
            100% { opacity:0.6; transform:translate(0,0) scale(1); }
        }
        .db-grid {
            position:absolute; inset:0;
            background-image: linear-gradient(rgba(0,200,255,0.035) 1px,transparent 1px), linear-gradient(90deg,rgba(0,200,255,0.035) 1px,transparent 1px);
            background-size:60px 60px;
            mask-image:radial-gradient(ellipse 100% 100% at 50% 50%,black 20%,transparent 80%);
            -webkit-mask-image:radial-gradient(ellipse 100% 100% at 50% 50%,black 20%,transparent 80%);
        }
        .db-particles { position:absolute; inset:0; }
        .db-star { position:absolute; border-radius:50%; background:#ffffff; animation:starTwinkle linear infinite; }
        @keyframes starTwinkle {
            0%,100% { opacity:0.05; transform:scale(1); }
            50%      { opacity:0.55; transform:scale(1.6); }
        }
        .db-topbar-glow {
            position:absolute; top:0; left:0; right:0; height:2px;
            background:linear-gradient(90deg,transparent 0%,rgba(0,200,255,0.7) 30%,rgba(120,0,255,0.7) 70%,transparent 100%);
            animation:topbarGlowPulse 4s ease-in-out infinite;
        }
        @keyframes topbarGlowPulse { 0%,100%{opacity:0.4;} 50%{opacity:1;} }
        ::-webkit-scrollbar{width:6px;height:6px;}
        ::-webkit-scrollbar-track{background:transparent;}
        ::-webkit-scrollbar-thumb{background:rgba(0,255,255,0.2);border-radius:99px;}
        ::-webkit-scrollbar-thumb:hover{background:#00ffff;}
    </style>
</head>
<body>
<!-- ══ GOATED ANIMATED BACKGROUND ══ -->
<div class="db-bg" aria-hidden="true">
    <div class="db-orb db-orb-1"></div>
    <div class="db-orb db-orb-2"></div>
    <div class="db-orb db-orb-3"></div>
    <div class="db-orb db-orb-4"></div>
    <div class="db-orb db-orb-5"></div>
    <div class="db-grid"></div>
    <div class="db-particles" id="dbParticles"></div>
    <div class="db-topbar-glow"></div>
</div>
<div class="login-outer-wrap">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
            <div class="mb-3">
                <a href="/signup" class="back-btn-global"><i class="bi bi-arrow-left"></i> BACK
                </a>
            </div>
            <div class="login-card">
                <div class="login-header">
                    <i class="bi bi-{% if is_reset %}key-fill{% else %}lock-fill{% endif %}"></i>
                    <h2>{% if is_reset %}Reset Password{% else %}Set Your Password{% endif %}</h2>
                    <p class="mb-1">Choose a strong password for</p>
                    <span class="email-tag" style="font-family:'Outfit',sans-serif; font-weight:700; color:#00ffff; font-size:0.88rem; padding: 4px 14px; background:rgba(0,255,255,0.08); border:1px solid rgba(0,255,255,0.25); border-radius:30px; display:inline-block; margin-top:6px; word-break:break-all; max-width:100%;">{{ email }}</span>
                </div>

                <div class="form-body">
                    {% if not is_reset %}
                    <!-- Step indicator -->
                    <div class="steps-indicator mb-3 d-flex align-items-center justify-content-center gap-2">
                        <div class="step-dot done" style="background:#10b981; color:#fff; border-color:#10b981;">✓</div>
                        <div class="step-line done" style="background:#10b981;"></div>
                        <div class="step-dot done" style="background:#10b981; color:#fff; border-color:#10b981;">✓</div>
                        <div class="step-line done" style="background:#10b981;"></div>
                        <div class="step-dot active">3</div>
                        <div class="step-line"></div>
                        <div class="step-dot">4</div>
                    </div>
                    {% endif %}

                    {% if error %}
                    <div class="alert alert-danger d-flex align-items-center gap-2" role="alert">
                        <i class="bi bi-exclamation-circle-fill"></i> {{ error }}
                    </div>
                    {% endif %}

                    <form method="POST" action="{% if is_reset %}/forgot-password/reset{% else %}/signup/set-password{% endif %}" id="pwForm">
                        <div class="mb-3">
                            <label class="form-label" for="password">New Password</label>
                            <div class="input-group">
                                <input type="password" name="password" id="password" class="form-control" required
                                       placeholder="At least 6 characters" autocomplete="new-password" autofocus
                                       style="border-top-right-radius: 0 !important; border-bottom-right-radius: 0 !important; border-right: none !important;">
                                <button class="btn" type="button" onclick="togglePasswordVisibility('password', this)"
                                        style="border: 1px solid rgba(0, 255, 255, 0.2) !important; border-left: none !important; background: #02040a !important; color: #94a3b8 !important; border-top-right-radius: 10px !important; border-bottom-right-radius: 10px !important; border-top-left-radius: 0 !important; border-bottom-left-radius: 0 !important;">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <div class="strength-bar" style="height:4px; background:rgba(255,255,255,0.08); border-radius:2px; margin-top:8px; overflow:hidden;"><div class="strength-fill" id="strengthFill" style="height:100%; width:0; transition:all 0.3s ease;"></div></div>
                            <small id="strengthLabel" style="font-size:0.78rem; display:block; margin-top:4px; font-weight:600; font-family:'Outfit',sans-serif;"></small>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="confirm">Confirm Password</label>
                            <div class="input-group">
                                <input type="password" name="confirm_password" id="confirm" class="form-control" required
                                       placeholder="Re-enter your password" autocomplete="new-password"
                                       style="border-top-right-radius: 0 !important; border-bottom-right-radius: 0 !important; border-right: none !important;">
                                <button class="btn" type="button" onclick="togglePasswordVisibility('confirm', this)"
                                        style="border: 1px solid rgba(0, 255, 255, 0.2) !important; border-left: none !important; background: #02040a !important; color: #94a3b8 !important; border-top-right-radius: 10px !important; border-bottom-right-radius: 10px !important; border-top-left-radius: 0 !important; border-bottom-left-radius: 0 !important;">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-login w-100 text-white mb-2">
                            <i class="bi bi-{% if is_reset %}check-circle-fill{% else %}arrow-right-circle-fill{% endif %} me-1"></i>
                            {% if is_reset %}Reset Password{% else %}Continue to Profile{% endif %}
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
<script>
    function togglePasswordVisibility(fieldId, btn) {
        var field = document.getElementById(fieldId);
        var icon = btn.querySelector('i');
        if (field.type === 'password') {
            field.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            field.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }

    const pwInput = document.getElementById('password');
    const fill = document.getElementById('strengthFill');
    const label = document.getElementById('strengthLabel');
    pwInput.addEventListener('input', () => {
        const v = pwInput.value;
        let score = 0;
        if (v.length >= 6) score++;
        if (v.length >= 10) score++;
        if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
        if (/\d/.test(v)) score++;
        if (/[^A-Za-z0-9]/.test(v)) score++;
        const labels = ['', 'Weak', 'Fair', 'Good', 'Strong', 'Very Strong'];
        const colors = ['', '#ef4444', '#f97316', '#eab308', '#22c55e', '#10b981'];
        fill.style.width = (score * 20) + '%';
        fill.style.background = colors[score] || '#e2e8f0';
        label.textContent = labels[score] || '';
        label.style.color = colors[score] || '';
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function(){
    var c=document.getElementById('dbParticles');
    if(!c)return;
    for(var i=0;i<60;i++){
        var s=document.createElement('div');
        s.className='db-star';
        var sz=Math.random()*2+1;
        s.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;animation-duration:'+(Math.random()*4+2)+'s;animation-delay:'+(Math.random()*6)+'s';
        c.appendChild(s);
    }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Set Password — AI Interview Platform</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script>
    (function() {
        var saved = localStorage.getItem('theme') || 'light';
        if (saved === 'dark') {
            document.documentElement.classList.add('dark-theme');
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root {
            --su-bg: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 50%, #f0f9ff 100%);
            --su-glow: rgba(16, 185, 129, 0.08);
            --su-card-bg: #ffffff;
            --su-card-border: rgba(16, 185, 129, 0.18);
            --su-card-shadow: 0 25px 60px rgba(16, 185, 129, 0.10);
            --su-input-bg: #f0fdf4;
            --su-input-border: rgba(16, 185, 129, 0.25);
            --su-input-color: #0f172a;
            --su-input-focus-bg: #ffffff;
            --su-label: #134e4a;
            --su-muted: #475569;
            --su-link: #059669;
        }
        html.dark-theme {
            --su-bg: linear-gradient(135deg, #061a13 0%, #0a1628 100%);
            --su-glow: rgba(16, 185, 129, 0.06);
            --su-card-bg: rgba(15, 40, 30, 0.65);
            --su-card-border: rgba(16, 185, 129, 0.25);
            --su-card-shadow: 0 25px 60px rgba(0,0,0,0.4);
            --su-input-bg: rgba(6, 26, 19, 0.7);
            --su-input-border: rgba(16, 185, 129, 0.2);
            --su-input-color: #f0fdf4;
            --su-input-focus-bg: rgba(6, 26, 19, 0.9);
            --su-label: #a7f3d0;
            --su-muted: #94a3b8;
            --su-link: #34d399;
        }

        body {
            min-height: 100vh;
            background: var(--su-bg);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 2rem 1rem;
            transition: background 0.3s;
        }

        .signup-wrap { width: 100%; max-width: 480px; }

        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--su-muted); font-size: 0.85rem; font-weight: 600;
            text-decoration: none; font-family: 'Outfit', sans-serif;
            background: var(--su-card-bg); border: 1px solid var(--su-card-border);
            padding: 7px 16px; border-radius: 10px;
            transition: all 0.2s; margin-bottom: 1.2rem;
        }
        .back-link:hover { color: var(--su-link); border-color: var(--su-link); transform: translateY(-1px); }

        .su-card {
            background: var(--su-card-bg);
            border: 1.5px solid var(--su-card-border);
            border-radius: 28px;
            box-shadow: var(--su-card-shadow);
            overflow: hidden;
            backdrop-filter: blur(20px);
            animation: slideUp 0.45s cubic-bezier(0.22,1,0.36,1) both;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .su-header {
            background: linear-gradient(135deg, #059669, #0891b2);
            padding: 2.2rem 2rem 1.8rem;
            text-align: center;
        }
        .su-icon-ring {
            width: 68px; height: 68px; border-radius: 50%;
            background: rgba(255,255,255,0.18);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 2rem; color: #fff;
            margin-bottom: 0.9rem;
            box-shadow: 0 0 0 10px rgba(255,255,255,0.06);
        }
        .su-header h1 {
            font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 1.6rem;
            color: #fff; margin-bottom: 0.2rem; letter-spacing: -0.02em;
        }
        .su-header p { color: rgba(255,255,255,0.88); font-size: 0.9rem; margin: 0; }
        .su-header .email-tag {
            display: inline-block; margin-top: 0.5rem;
            background: rgba(255,255,255,0.2); border-radius: 6px;
            padding: 3px 10px; font-size: 0.88rem; font-weight: 700; color: #fff;
        }

        .su-body { padding: 2rem 2.2rem 2.4rem; }

        .su-label {
            font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 0.78rem;
            text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--su-label); margin-bottom: 0.45rem;
            display: flex; align-items: center; gap: 5px;
        }

        .su-input {
            width: 100%;
            background: var(--su-input-bg) !important;
            border: 1.5px solid var(--su-input-border) !important;
            border-radius: 12px !important;
            color: var(--su-input-color) !important;
            font-size: 0.96rem;
            padding: 0.75rem 1.1rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        .su-input:focus {
            border-color: #10b981 !important;
            box-shadow: 0 0 0 3px rgba(16,185,129,0.18) !important;
            background: var(--su-input-focus-bg) !important;
        }

        .strength-bar { height: 4px; border-radius: 99px; background: #e2e8f0; margin-top: 0.5rem; overflow: hidden; }
        .strength-fill { height: 100%; border-radius: 99px; transition: width 0.3s, background 0.3s; width: 0; }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #059669 0%, #0891b2 100%);
            border: none; border-radius: 12px; color: #fff;
            font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.05rem;
            padding: 0.88rem 2rem; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 20px rgba(5,150,105,0.35);
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            margin-top: 1.4rem;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(5,150,105,0.45); }

        .su-error {
            background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
            border-radius: 10px; padding: 0.7rem 1rem; color: #ef4444;
            font-size: 0.88rem; display: flex; align-items: center; gap: 8px;
            margin-bottom: 1.2rem;
        }

        .steps-indicator { display: flex; align-items: center; justify-content: center; margin-bottom: 1.5rem; }
        .step-dot {
            width: 28px; height: 28px; border-radius: 50%;
            font-size: 0.75rem; font-weight: 800; font-family: 'Outfit', sans-serif;
            display: flex; align-items: center; justify-content: center;
            background: rgba(16,185,129,0.15); color: #10b981; border: 2px solid #10b981;
        }
        .step-dot.active { background: #10b981; color: #fff; }
        .step-dot.done { background: #d1fae5; color: #059669; border-color: #059669; }
        .step-line { width: 36px; height: 2px; background: rgba(16,185,129,0.25); }
        .step-line.done { background: #10b981; }
    </style>
</head>
<body>
<div class="signup-wrap">
    <a href="/signup" class="back-link"><i class="bi bi-arrow-left"></i>
        {% if is_reset %}Back to Login{% else %}Back{% endif %}
    </a>

    <div class="su-card">
        <div class="su-header">
            <div class="su-icon-ring">
                <i class="bi bi-{% if is_reset %}key-fill{% else %}lock-fill{% endif %}"></i>
            </div>
            <h1>{% if is_reset %}Reset Password{% else %}Set Your Password{% endif %}</h1>
            <p>Choose a strong password for</p>
            <span class="email-tag">{{ email }}</span>
        </div>

        <div class="su-body">
            {% if not is_reset %}
            <div class="steps-indicator">
                <div class="step-dot done">✓</div>
                <div class="step-line done"></div>
                <div class="step-dot done">✓</div>
                <div class="step-line done"></div>
                <div class="step-dot active">3</div>
                <div class="step-line"></div>
                <div class="step-dot">4</div>
            </div>
            {% endif %}

            {% if error %}
            <div class="su-error"><i class="bi bi-exclamation-circle-fill"></i> {{ error }}</div>
            {% endif %}

            <form method="POST" action="{% if is_reset %}/forgot-password/reset{% else %}/signup/set-password{% endif %}" id="pwForm">
                <div class="mb-3">
                    <label class="su-label"><i class="bi bi-lock"></i> New Password</label>
                    <input type="password" name="password" id="password" class="su-input" required
                           placeholder="At least 6 characters" autocomplete="new-password" autofocus>
                    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                    <small id="strengthLabel" style="font-size:0.78rem; color:var(--su-muted); font-family:'Outfit',sans-serif;"></small>
                </div>
                <div class="mb-3">
                    <label class="su-label"><i class="bi bi-lock-fill"></i> Confirm Password</label>
                    <input type="password" name="confirm_password" id="confirm" class="su-input" required
                           placeholder="Re-enter your password" autocomplete="new-password">
                </div>

                <button type="submit" class="btn-submit">
                    <i class="bi bi-{% if is_reset %}check-circle-fill{% else %}arrow-right-circle-fill{% endif %}"></i>
                    {% if is_reset %}Reset Password{% else %}Continue to Profile{% endif %}
                </button>
            </form>
        </div>
    </div>
</div>
<script>
    const pwInput = document.getElementById('password');
    const fill = document.getElementById('strengthFill');
    const label = document.getElementById('strengthLabel');
    pwInput.addEventListener('input', () => {
        const v = pwInput.value;
        let score = 0;
        if (v.length >= 6) score++;
        if (v.length >= 10) score++;
        if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
        if (/\d/.test(v)) score++;
        if (/[^A-Za-z0-9]/.test(v)) score++;
        const labels = ['', 'Weak', 'Fair', 'Good', 'Strong', 'Very Strong'];
        const colors = ['', '#ef4444', '#f97316', '#eab308', '#22c55e', '#10b981'];
        fill.style.width = (score * 20) + '%';
        fill.style.background = colors[score] || '#e2e8f0';
        label.textContent = labels[score] || '';
        label.style.color = colors[score] || '';
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

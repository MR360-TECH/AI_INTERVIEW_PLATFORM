<!DOCTYPE html>
<html lang="en" class="dark-theme">
<head>
    <title>{% if is_reset %}Reset Password{% else %}Set Password{% endif %} — AI Assessment Studio</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script>
        (function() {
            document.documentElement.classList.add('dark-theme');
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 2.5rem 1rem;
        }

        .login-outer-wrap {
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .strength-bar {
            height: 4px;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.08);
            margin-top: 8px;
            overflow: hidden;
        }
        .strength-fill {
            height: 100%;
            border-radius: 99px;
            transition: all 0.3s ease;
            width: 0;
        }

        .steps-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .step-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 0.75rem;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 255, 255, 0.1);
            color: #00ffff;
            border: 2px solid rgba(0, 255, 255, 0.3);
        }
        .step-dot.active {
            background: #00ffff;
            color: #020510;
            border-color: #00ffff;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
        }
        .step-dot.done {
            background: rgba(52, 211, 153, 0.2);
            color: #34d399;
            border-color: #34d399;
        }
        .step-line {
            width: 32px;
            height: 2px;
            background: rgba(0, 255, 255, 0.15);
        }
        .step-line.done {
            background: #34d399;
        }
    </style>
</head>
<body>

<!-- ══ GOATED ANIMATED BACKGROUND ══ -->
<div class="db-bg" aria-hidden="true">
    <div class="db-orb db-orb-1"></div>
    <div class="db-orb db-orb-2"></div>
    <div class="db-orb db-orb-3"></div>
    <div class="db-orb db-orb-4"></div>
    <div class="db-orb db-orb-5"></div>
    <div class="db-grid"></div>
    <div class="db-particles" id="dbParticles"></div>
    <div class="db-topbar-glow"></div>
</div>

<div class="login-outer-wrap">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
                <div class="mb-3">
                    <a href="/signup" class="back-btn-global"><i class="bi bi-arrow-left"></i> BACK</a>
                </div>
                <div class="login-card">
                    <div class="login-header">
                        <i class="bi bi-{% if is_reset %}key-fill{% else %}lock-fill{% endif %}"></i>
                        <h2>{% if is_reset %}Reset Password{% else %}Set Your Password{% endif %}</h2>
                        <p class="mb-1">Choose a strong password for</p>
                        <span class="email-tag" style="font-family:'Outfit',sans-serif; font-weight:700; color:#00ffff; font-size:0.88rem; padding: 4px 14px; background:rgba(0,255,255,0.08); border:1px solid rgba(0,255,255,0.25); border-radius:30px; display:inline-block; margin-top:6px; word-break:break-all; max-width:100%;">{{ email }}</span>
                    </div>

                    <div class="form-body">
                        {% if not is_reset %}
                        <!-- Step indicator -->
                        <div class="steps-indicator mb-3 d-flex align-items-center justify-content-center gap-2">
                            <div class="step-dot done">✓</div>
                            <div class="step-line done"></div>
                            <div class="step-dot done">✓</div>
                            <div class="step-line done"></div>
                            <div class="step-dot active">3</div>
                            <div class="step-line"></div>
                            <div class="step-dot">4</div>
                        </div>
                        {% endif %}

                        {% if error %}
                        <div class="alert alert-danger d-flex align-items-center gap-2" role="alert">
                            <i class="bi bi-exclamation-circle-fill"></i> {{ error }}
                        </div>
                        {% endif %}

                        <form method="POST" action="{% if is_reset %}/forgot-password/reset{% else %}/signup/set-password{% endif %}" id="pwForm">
                            <div class="mb-3">
                                <label class="form-label" for="password">New Password</label>
                                <div class="input-group">
                                    <input type="password" name="password" id="password" class="form-control" required
                                           placeholder="At least 6 characters" autocomplete="new-password" autofocus
                                           style="border-top-right-radius: 0 !important; border-bottom-right-radius: 0 !important; border-right: none !important;">
                                    <button class="btn" type="button" onclick="togglePasswordVisibility('password', this)"
                                            style="border: 1px solid rgba(0, 255, 255, 0.2) !important; border-left: none !important; background: #02040a !important; color: #94a3b8 !important; border-top-right-radius: 10px !important; border-bottom-right-radius: 10px !important; border-top-left-radius: 0 !important; border-bottom-left-radius: 0 !important;">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                                <small id="strengthLabel" style="font-size:0.78rem; display:block; margin-top:4px; font-weight:600; font-family:'Outfit',sans-serif;"></small>
                            </div>

                            <div class="mb-4">
                                <label class="form-label" for="confirm">Confirm Password</label>
                                <div class="input-group">
                                    <input type="password" name="confirm_password" id="confirm" class="form-control" required
                                           placeholder="Re-enter your password" autocomplete="new-password"
                                           style="border-top-right-radius: 0 !important; border-bottom-right-radius: 0 !important; border-right: none !important;">
                                    <button class="btn" type="button" onclick="togglePasswordVisibility('confirm', this)"
                                            style="border: 1px solid rgba(0, 255, 255, 0.2) !important; border-left: none !important; background: #02040a !important; color: #94a3b8 !important; border-top-right-radius: 10px !important; border-bottom-right-radius: 10px !important; border-top-left-radius: 0 !important; border-bottom-left-radius: 0 !important;">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-login w-100 text-white mb-2">
                                <i class="bi bi-{% if is_reset %}check-circle-fill{% else %}arrow-right-circle-fill{% endif %} me-1"></i>
                                {% if is_reset %}Reset Password{% else %}Continue to Profile{% endif %}
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function togglePasswordVisibility(fieldId, btn) {
        var field = document.getElementById(fieldId);
        var icon = btn.querySelector('i');
        if (field.type === 'password') {
            field.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            field.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }

    const pwInput = document.getElementById('password');
    const fill = document.getElementById('strengthFill');
    const label = document.getElementById('strengthLabel');
    pwInput.addEventListener('input', () => {
        const v = pwInput.value;
        let score = 0;
        if (v.length >= 6) score++;
        if (v.length >= 10) score++;
        if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
        if (/\d/.test(v)) score++;
        if (/[^A-Za-z0-9]/.test(v)) score++;
        const labels = ['', 'Weak', 'Fair', 'Good', 'Strong', 'Very Strong'];
        const colors = ['', '#ef4444', '#f97316', '#eab308', '#22c55e', '#10b981'];
        fill.style.width = (score * 20) + '%';
        fill.style.background = colors[score] || '#e2e8f0';
        label.textContent = labels[score] || '';
        label.style.color = colors[score] || '';
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function(){
    var c=document.getElementById('dbParticles');
    if(!c)return;
    for(var i=0;i<60;i++){
        var s=document.createElement('div');
        s.className='db-star';
        var sz=Math.random()*2+1;
        s.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;animation-duration:'+(Math.random()*4+2)+'s;animation-delay:'+(Math.random()*6)+'s';
        c.appendChild(s);
    }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forgot Password — AI Interview Platform</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script>
    (function() {
        var saved = localStorage.getItem('theme') || 'light';
        if (saved === 'dark') {
            document.documentElement.classList.add('dark-theme');
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root {
            --fp-bg: linear-gradient(135deg, #fff7ed 0%, #fefce8 50%, #fff1f2 100%);
            --fp-glow: rgba(245, 158, 11, 0.08);
            --fp-card-bg: #ffffff;
            --fp-card-border: rgba(245, 158, 11, 0.2);
            --fp-card-shadow: 0 25px 60px rgba(245,158,11,0.10);
            --fp-input-bg: #fffbeb;
            --fp-input-border: rgba(245, 158, 11, 0.3);
            --fp-input-color: #0f172a;
            --fp-input-focus-bg: #ffffff;
            --fp-label: #78350f;
            --fp-muted: #6b7280;
            --fp-link: #d97706;
        }
        html.dark-theme {
            --fp-bg: linear-gradient(135deg, #1c1003 0%, #111827 100%);
            --fp-glow: rgba(245,158,11,0.06);
            --fp-card-bg: rgba(30,20,5,0.7);
            --fp-card-border: rgba(245,158,11,0.25);
            --fp-card-shadow: 0 25px 60px rgba(0,0,0,0.4);
            --fp-input-bg: rgba(30,20,5,0.8);
            --fp-input-border: rgba(245,158,11,0.2);
            --fp-input-color: #fef3c7;
            --fp-input-focus-bg: rgba(30,20,5,0.95);
            --fp-label: #fcd34d;
            --fp-muted: #94a3b8;
            --fp-link: #fbbf24;
        }

        body {
            min-height: 100vh;
            background: var(--fp-bg);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 2rem 1rem;
            transition: background 0.3s;
        }
        body::before {
            content: ''; position: fixed; top: -15%; left: -15%;
            width: 45%; height: 45%;
            background: radial-gradient(circle, var(--fp-glow) 0%, transparent 65%);
            z-index: 0; pointer-events: none;
        }

        .fp-wrap { width: 100%; max-width: 460px; position: relative; z-index: 10; }

        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--fp-muted); font-size: 0.85rem; font-weight: 600;
            text-decoration: none; font-family: 'Outfit', sans-serif;
            background: var(--fp-card-bg); border: 1px solid var(--fp-card-border);
            padding: 7px 16px; border-radius: 10px;
            transition: all 0.2s; margin-bottom: 1.2rem;
        }
        .back-link:hover { color: var(--fp-link); border-color: var(--fp-link); transform: translateY(-1px); }

        .fp-card {
            background: var(--fp-card-bg);
            border: 1.5px solid var(--fp-card-border);
            border-radius: 28px; box-shadow: var(--fp-card-shadow);
            overflow: hidden; backdrop-filter: blur(20px);
            animation: slideUp 0.45s cubic-bezier(0.22,1,0.36,1) both;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .fp-header {
            background: linear-gradient(135deg, #d97706, #b45309);
            padding: 2.2rem 2rem 1.8rem; text-align: center; position: relative; overflow: hidden;
        }
        .fp-header::before {
            content: ''; position: absolute; top: -25px; right: -25px;
            width: 100px; height: 100px; border-radius: 50%;
            background: rgba(255,255,255,0.08); pointer-events: none;
        }
        .fp-icon-ring {
            width: 68px; height: 68px; border-radius: 50%;
            background: rgba(255,255,255,0.18);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 2rem; color: #fff; margin-bottom: 0.9rem;
            box-shadow: 0 0 0 10px rgba(255,255,255,0.06);
        }
        .fp-header h1 {
            font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 1.6rem;
            color: #fff; margin-bottom: 0.2rem;
        }
        .fp-header p { color: rgba(255,255,255,0.88); font-size: 0.9rem; margin: 0; }

        .fp-body { padding: 2rem 2.2rem 2.4rem; }

        .fp-label {
            font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 0.78rem;
            text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--fp-label); margin-bottom: 0.45rem;
            display: flex; align-items: center; gap: 5px;
        }

        .fp-input {
            width: 100%;
            background: var(--fp-input-bg) !important;
            border: 1.5px solid var(--fp-input-border) !important;
            border-radius: 12px !important;
            color: var(--fp-input-color) !important;
            font-size: 0.96rem; padding: 0.75rem 1.1rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s; outline: none;
        }
        .fp-input::placeholder { color: #9ca3af; font-size: 0.88rem; }
        .fp-input:focus {
            border-color: #f59e0b !important;
            box-shadow: 0 0 0 3px rgba(245,158,11,0.18) !important;
            background: var(--fp-input-focus-bg) !important;
        }

        .btn-fp {
            width: 100%;
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            border: none; border-radius: 12px; color: #fff;
            font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.05rem;
            padding: 0.88rem 2rem; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 20px rgba(217,119,6,0.35);
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            margin-top: 1.4rem;
        }
        .btn-fp:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(217,119,6,0.45); }

        .fp-error {
            background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
            border-radius: 10px; padding: 0.7rem 1rem; color: #ef4444;
            font-size: 0.88rem; display: flex; align-items: center; gap: 8px; margin-bottom: 1.2rem;
        }

        .fp-info {
            background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.25);
            border-radius: 12px; padding: 0.8rem 1rem;
            color: var(--fp-muted); font-size: 0.84rem;
            display: flex; align-items: flex-start; gap: 8px; margin-bottom: 1.4rem;
        }
        .fp-info i { color: #f59e0b; flex-shrink: 0; font-size: 1rem; margin-top: 2px; }

        .fp-footer { text-align: center; margin-top: 1.4rem; font-size: 0.88rem; color: var(--fp-muted); }
        .fp-footer a { color: var(--fp-link); font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
<div class="fp-wrap">
    <a href="/login" class="back-link"><i class="bi bi-arrow-left"></i> Back to Sign In</a>

    <div class="fp-card">
        <div class="fp-header">
            <div class="fp-icon-ring"><i class="bi bi-key-fill"></i></div>
            <h1>Forgot Password?</h1>
            <p>No worries — we'll send a reset code to your email</p>
        </div>

        <div class="fp-body">
            {% if error %}
            <div class="fp-error"><i class="bi bi-exclamation-circle-fill"></i> {{ error }}</div>
            {% endif %}

            <div class="fp-info">
                <i class="bi bi-info-circle-fill"></i>
                <span>Enter your registered email address. We'll send a 6-digit OTP to verify your identity before letting you set a new password.</span>
            </div>

            <form method="POST" action="/forgot-password" id="fpForm">
                <div class="mb-3">
                    <label class="fp-label"><i class="bi bi-envelope" style="opacity:0.7;"></i> Registered Email</label>
                    <input type="email" name="email" class="fp-input" required
                           placeholder="your@email.com" autocomplete="email" autofocus>
                </div>

                <button type="submit" class="btn-fp">
                    <i class="bi bi-send-fill"></i> Send Reset Code
                </button>
            </form>

            <div class="fp-footer">
                Remembered it? <a href="/login">Sign in</a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

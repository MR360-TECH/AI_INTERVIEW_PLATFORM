<!DOCTYPE html>
<html lang="en" class="dark-theme">
<head>
    <title>Edit Profile â€” AI Interview Platform</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script>
    (function() {
        document.documentElement.classList.add('dark-theme');
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
    })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root {
            --accent: #4f46e5;
            --accent2: #818cf8;
            --success-glow: #10b981;
            --bg: var(--bg-base);
            --card-bg: var(--surface);
            --border-glow: var(--brand-glow);
            --border-color: var(--border-light);
            --text-main: var(--ink);
            --text-muted: var(--muted);
            --text-desc: var(--subtle);
            --glow-color: rgba(99, 102, 241, 0.03);
            --input-bg: var(--surface);
            --input-border: var(--border-mid);
            --input-text: var(--ink);
            --input-focus-bg: var(--surface);
            --type-toggle-bg: var(--bg-alt);
            --type-toggle-btn-color: var(--muted);
            --success-note-bg: rgba(16, 185, 129, 0.08);
            --success-note-border: rgba(16, 185, 129, 0.25);
            --success-note-text: var(--ink);
            --glass-border: var(--border-light);
            --shadow-rgba: rgba(0, 0, 0, 0.08);
            --edu-pill-bg: var(--bg-alt);
            --edu-pill-border: var(--border-mid);
            --edu-pill-color: var(--muted);
            --sep-line: var(--border-mid);
            --back-btn-bg: var(--surface);
            --back-btn-border: var(--border-mid);
            --back-btn-text: var(--muted);
            --back-btn-hover-bg: var(--bg-alt);
            --back-btn-hover-text: var(--ink);
            --back-btn-hover-border: var(--brand-blue);
        }

        html.dark-theme {
            --accent: #4f46e5;
            --accent2: #818cf8;
            --success-glow: #10b981;
            --bg: linear-gradient(135deg, #0f0c29 0%, #1a1040 40%, #111827 100%);
            --card-bg: rgba(255, 255, 255, 0.06);
            --border-glow: rgba(129, 140, 248, 0.35);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f1f5f9;
            --text-muted: #cbd5e1;
            --text-desc: #94a3b8;
            --glow-color: rgba(99, 102, 241, 0.06);
            --input-bg: rgba(255, 255, 255, 0.07);
            --input-border: rgba(255, 255, 255, 0.12);
            --input-text: #f1f5f9;
            --input-focus-bg: rgba(255, 255, 255, 0.1);
            --type-toggle-bg: rgba(255, 255, 255, 0.05);
            --type-toggle-btn-color: rgba(255, 255, 255, 0.5);
            --success-note-bg: rgba(16, 185, 129, 0.08);
            --success-note-border: rgba(16, 185, 129, 0.25);
            --success-note-text: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(129, 140, 248, 0.35);
            --shadow-rgba: rgba(0, 0, 0, 0.45);
            --edu-pill-bg: rgba(255, 255, 255, 0.04);
            --edu-pill-border: rgba(255, 255, 255, 0.15);
            --edu-pill-color: rgba(255, 255, 255, 0.5);
            --sep-line: rgba(255, 255, 255, 0.1);
            --back-btn-bg: rgba(255, 255, 255, 0.05);
            --back-btn-border: rgba(255, 255, 255, 0.1);
            --back-btn-text: #94a3b8;
            --back-btn-hover-bg: rgba(255, 255, 255, 0.1);
            --back-btn-hover-text: #ffffff;
            --back-btn-hover-border: rgba(255, 255, 255, 0.2);
        }

        body {
            min-height: 100vh;
            
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.25s ease, color 0.25s ease;
            font-size: 15px;
            line-height: 1.6;
        }

        

        .reg-glass {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 60px var(--shadow-rgba);
            animation: slideUp 0.55s cubic-bezier(0.22,1,0.36,1) both;
            transition: border-color 0.3s, background-color 0.25s;
        }

        .reg-glass:hover {
            border-color: var(--border-glow);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(36px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .reg-header {
            background: linear-gradient(135deg, var(--accent) 0%, #7c3aed 100%);
            padding: 2.2rem 2rem 1.8rem;
            text-align: center;
            position: relative;
        }

        .reg-header .icon-ring {
            width: 68px; height: 68px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 2rem; color: #fff;
            margin-bottom: 0.9rem;
            box-shadow: 0 0 0 8px rgba(255,255,255,0.07);
        }
        .reg-header h2 { color: #fff; font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 1.7rem; margin-bottom: 0.35rem; letter-spacing: -0.02em; }
        .reg-header p  { color: rgba(255,255,255,0.88); font-size: 0.93rem; margin: 0; font-family: 'Inter', sans-serif; }

        .reg-body { padding: 2.2rem 2.5rem 2.5rem; }

        .type-toggle {
            display: flex;
            gap: 0.5rem;
            background: var(--type-toggle-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            padding: 5px;
            margin-bottom: 1.8rem;
        }
        .type-toggle button {
            flex: 1;
            border: none;
            border-radius: 10px;
            padding: 0.65rem 1rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 700; font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.22s;
            color: var(--type-toggle-btn-color);
            background: transparent;
            letter-spacing: 0.01em;
        }
        .type-toggle button.active {
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            color: #fff;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
        }
        .type-toggle button i { margin-right: 6px; font-size: 0.95rem; }

        .form-label {
            color: var(--text-muted);
            font-family: 'Outfit', sans-serif;
            font-weight: 700; font-size: 0.78rem;
            text-transform: uppercase; letter-spacing: 0.08em;
            margin-bottom: 0.45rem;
            display: flex; align-items: center; gap: 5px;
        }
        .form-label i { opacity: 0.65; font-size: 0.85rem; }
        .form-control, .form-select {
            background: var(--input-bg) !important;
            border: 1.5px solid var(--input-border) !important;
            border-radius: 11px !important;
            color: var(--input-text) !important;
            font-size: 0.96rem;
            font-family: 'Inter', sans-serif;
            padding: 0.72rem 1.1rem;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .form-control::placeholder { color: var(--text-desc) !important; font-size: 0.88rem; }
        .form-control:focus, .form-select:focus {
            background: var(--input-focus-bg) !important;
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.18) !important;
            outline: none;
        }
        .form-select option { background: #1e1b4b; color: #f1f5f9; }

        .locked-field {
            background: var(--input-bg) !important;
            opacity: 0.6;
            border-style: dashed !important;
            color: var(--text-desc) !important;
            cursor: not-allowed;
        }

        .edu-pills { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.45rem; }
        .edu-pills input[type="radio"] { display: none; }
        .edu-pills label {
            padding: 0.45rem 1rem;
            border-radius: 99px;
            border: 1.5px solid var(--edu-pill-border);
            color: var(--edu-pill-color);
            font-family: 'Outfit', sans-serif;
            font-size: 0.83rem; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
            background: var(--edu-pill-bg);
            letter-spacing: 0.01em;
        }
        .edu-pills label:hover { border-color: var(--accent); color: var(--accent); }
        .edu-pills input:checked + label {
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.35);
        }

        .section-sep {
            display: flex; align-items: center; gap: 0.9rem;
            margin: 2rem 0 1.5rem;
        }
        .section-sep span {
            color: var(--text-desc);
            font-family: 'Outfit', sans-serif;
            font-size: 0.72rem;
            font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em;
            white-space: nowrap;
        }
        .section-sep::before, .section-sep::after {
            content: ''; flex: 1;
            height: 1.5px; background: var(--sep-line);
        }

        .btn-reg-submit {
            background: linear-gradient(135deg, var(--accent) 0%, #7c3aed 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-weight: 800; font-size: 1.05rem;
            letter-spacing: 0.01em;
            padding: 0.9rem 2rem;
            width: 100%;
            margin-top: 1.6rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
            display: flex; align-items: center; justify-content: center; gap: 0.55rem;
        }
        .btn-reg-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(79, 70, 229, 0.55);
        }
        .btn-reg-submit:active { transform: translateY(0); }

        .success-note {
            display: flex; gap: 0.7rem; align-items: flex-start;
            background: var(--success-note-bg);
            border: 1px solid var(--success-note-border);
            border-radius: 12px; padding: 12px 16px;
            color: var(--success-note-text); font-size: 0.88rem;
            margin-bottom: 1.5rem;
        }
        .success-note i { color: var(--success-glow); font-size: 1.1rem; flex-shrink: 0; }

        .back-btn-global {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--back-btn-text);
            background: var(--back-btn-bg);
            border: 1px solid var(--back-btn-border);
            padding: 8px 18px;
            border-radius: 10px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.88rem;
            text-decoration: none;
            transition: all 0.2s;
        }

        .back-btn-global:hover {
            color: var(--back-btn-hover-text);
            background: var(--back-btn-hover-bg);
            border-color: var(--back-btn-hover-border);
            transform: translateY(-1px);
        }

        .fade-section { transition: opacity 0.3s, max-height 0.4s; overflow: hidden; }
        .fade-section.hidden { opacity: 0; max-height: 0; pointer-events: none; }
        .fade-section.visible { opacity: 1; max-height: 600px; }
    </style>
</head>
<body>

{% include 'navbar.html' %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">

            <!-- Back button -->
            <div class="mb-3">
                <a href="/dashboard" class="back-btn-global">
                    <i class="bi bi-arrow-left"></i> Back
                </a>
            </div>

            <div class="reg-glass">

                <!-- Header -->
                <div class="reg-header">
                    <div class="icon-ring"><i class="bi bi-pencil-square"></i></div>
                    <h2>Edit Your Profile</h2>
                    <p>Keep your profile details up-to-date for accurate evaluations</p>
                </div>

                <!-- Body -->
                <div class="reg-body">

                    {% if success %}
                    <div class="success-note">
                        <i class="bi bi-check-circle-fill"></i>
                        <div>{{ success }}</div>
                    </div>
                    {% endif %}

                    <form method="POST">

                        <!-- Full name -->
                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-person"></i> Full Name</label>
                            <input type="text" name="full_name" class="form-control"
                                   placeholder="e.g. Pavan Kumar" value="{{ user.full_name }}" required
                                   autocomplete="name">
                        </div>

                        <!-- Email: locked -->
                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-envelope"></i> Email Address</label>
                            <input type="email" class="form-control locked-field"
                                   value="{{ user.email }}" readonly
                                   title="Email is locked and cannot be changed">
                        </div>

                        <!-- Gender -->
                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-gender-ambiguous"></i> Gender</label>
                            <select name="gender" class="form-select">
                                <option value="">â€” Select â€”</option>
                                <option value="Male" {% if user.gender == "Male" %}selected{% endif %}>Male</option>
                                <option value="Female" {% if user.gender == "Female" %}selected{% endif %}>Female</option>
                                <option value="Other" {% if user.gender == "Other" %}selected{% endif %}>Other / Prefer not to say</option>
                            </select>
                        </div>

                        <!-- User type toggle -->
                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-person-badge"></i> Profile Type</label>
                            <div class="type-toggle" id="typeToggle">
                                <button type="button" class="{% if user.user_type != 'professional' %}active{% endif %}" id="btn-student" onclick="setType('student')">
                                    <i class="bi bi-mortarboard-fill"></i> Student
                                </button>
                                <button type="button" class="{% if user.user_type == 'professional' %}active{% endif %}" id="btn-professional" onclick="setType('professional')">
                                    <i class="bi bi-briefcase-fill"></i> Professional
                                </button>
                            </div>
                            <input type="hidden" name="user_type" id="userTypeInput" value="{{ user.user_type or 'student' }}">
                        </div>

                        <!-- Education (Students only) -->
                        <div class="fade-section {% if user.user_type != 'professional' %}visible{% else %}hidden{% endif %}" id="edu-section">
                            <div class="mb-3">
                                <label class="form-label"><i class="bi bi-mortarboard"></i> Education Level</label>
                                <div class="edu-pills">
                                    <input class="form-check-input" type="radio" name="education" value="School" id="edu1" {% if user.education == "School" %}checked{% endif %}>
                                    <label for="edu1">School</label>
                                    <input class="form-check-input" type="radio" name="education" value="PU/12th" id="edu2" {% if user.education == "PU/12th" %}checked{% endif %}>
                                    <label for="edu2">PU / 12th</label>
                                    <input class="form-check-input" type="radio" name="education" value="Degree" id="edu3" {% if user.education == "Degree" %}checked{% endif %}>
                                    <label for="edu3">Degree</label>
                                    <input class="form-check-input" type="radio" name="education" value="Post Graduate" id="edu4" {% if user.education == "Post Graduate" %}checked{% endif %}>
                                    <label for="edu4">Post Graduate</label>
                                </div>
                            </div>

                            <!-- Course and Semester -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label"><i class="bi bi-book"></i> Course / Branch</label>
                                    <input type="text" name="course" class="form-control"
                                           value="{{ user.course or '' }}" placeholder="e.g. BCA, B.Tech CSE">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label"><i class="bi bi-calendar3"></i> Semester / Year</label>
                                    <input type="text" name="semester" class="form-control"
                                           value="{{ user.semester or '' }}" placeholder="e.g. 6th Sem, 3rd Year">
                                </div>
                            </div>
                        </div>

                        <!-- Professional fields (hidden by default) -->
                        <div class="fade-section {% if user.user_type == 'professional' %}visible{% else %}hidden{% endif %}" id="prof-section">
                            <div class="mb-3">
                                <label class="form-label"><i class="bi bi-building"></i> Current Designation</label>
                                <input type="text" name="current_designation" class="form-control"
                                       id="designationInput" value="{{ user.current_designation or '' }}" placeholder="e.g. Software Engineer, Product Manager">
                            </div>
                            <div class="mb-3">
                                <label class="form-label"><i class="bi bi-clock-history"></i> Years of Experience</label>
                                <input type="number" name="years_of_experience" class="form-control"
                                       id="expInput" value="{{ user.years_of_experience or '' }}" placeholder="e.g. 3" min="0" max="50" step="0.5">
                            </div>
                        </div>

                        <!-- Optional profile enrichment -->
                        <div class="section-sep"><span>Optional â€” Enrich Your Profile</span></div>

                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-tools"></i> Primary Skills</label>
                            <input type="text" name="skills" class="form-control"
                                   value="{{ user.skills or '' }}" placeholder="e.g. Python, React, Machine Learning (comma separated)">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label"><i class="bi bi-github"></i> GitHub / Portfolio URL</label>
                                <input type="url" name="github_url" class="form-control"
                                       value="{{ user.github_url or '' }}" placeholder="https://github.com/username">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label"><i class="bi bi-linkedin"></i> LinkedIn URL</label>
                                <input type="url" name="linkedin_url" class="form-control"
                                       value="{{ user.linkedin_url or '' }}" placeholder="https://linkedin.com/in/username">
                            </div>
                        </div>

                        <!-- Submit -->
                        <button type="submit" class="btn-reg-submit">
                            <i class="bi bi-check-circle"></i> Save Changes
                        </button>
                    </form>

                </div><!-- /reg-body -->
            </div><!-- /reg-glass -->
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function setType(type) {
        document.getElementById('userTypeInput').value = type;

        const eduSection  = document.getElementById('edu-section');
        const profSection = document.getElementById('prof-section');
        const btnStudent  = document.getElementById('btn-student');
        const btnProf     = document.getElementById('btn-professional');

        if (type === 'student') {
            eduSection.classList.replace('hidden','visible');
            profSection.classList.replace('visible','hidden');
            btnStudent.classList.add('active');
            btnProf.classList.remove('active');
            // remove required from professional fields
            document.getElementById('designationInput').removeAttribute('required');
            document.getElementById('expInput').removeAttribute('required');
        } else {
            eduSection.classList.replace('visible','hidden');
            profSection.classList.replace('hidden','visible');
            btnStudent.classList.remove('active');
            btnProf.classList.add('active');
        }
    }

    // Run initially to ensure correct fields are hidden/shown based on user's current user_type
    document.addEventListener("DOMContentLoaded", function() {
        setType('{{ user.user_type or "student" }}');
    });
</script>
</body>
</html>

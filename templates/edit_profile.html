<!DOCTYPE html>
<html lang="en" class="dark-theme">
<head>
    <title>Edit Profile — AI Interview Platform</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Update your candidate profile on the AI Interview Platform.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script>
    (function() {
        document.documentElement.classList.add('dark-theme');
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
    })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Ambient glow orbs — use divs (body::before/after are suppressed globally) */
        .orb-tl {
            pointer-events: none;
            position: fixed;
            top: -120px; left: -120px;
            width: 520px; height: 520px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,212,255,0.16) 0%, transparent 70%);
            z-index: 0;
            animation: floatOrb1 13s ease-in-out infinite alternate;
        }
        .orb-br {
            pointer-events: none;
            position: fixed;
            bottom: -110px; right: -110px;
            width: 460px; height: 460px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,100,255,0.12) 0%, transparent 70%);
            z-index: 0;
            animation: floatOrb2 16s ease-in-out infinite alternate;
        }
        @keyframes floatOrb1 {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 80px) scale(1.1); }
        }
        @keyframes floatOrb2 {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-50px, -70px) scale(1.08); }
        }

        .page-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            padding: 2.5rem 1rem 4rem;
            position: relative;
            z-index: 1;
        }

        .inner-col {
            width: 100%;
            max-width: 680px;
        }

        /* Animated glow border on card — matches login page */
        .login-card {
            position: relative;
        }
        .login-card::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 25px;
            background: linear-gradient(135deg, rgba(0,255,255,0.35), rgba(0,100,255,0.2), rgba(0,255,255,0.1));
            z-index: -1;
            opacity: 0;
            animation: cardGlow 4s ease-in-out infinite alternate;
        }
        @keyframes cardGlow {
            0%   { opacity: 0; }
            100% { opacity: 1; }
        }

        .text-link {
            color: var(--brand-blue);
            font-weight: 700;
            text-decoration: none;
            transition: opacity 0.15s ease;
        }
        .text-link:hover { opacity: 0.8; text-decoration: none; }

        /* Student / Professional toggle */
        .type-toggle {
            display: flex;
            gap: 0.5rem;
            background: rgba(2, 4, 10, 0.75);
            border: 1.5px solid rgba(0, 255, 255, 0.25);
            border-radius: 14px;
            padding: 5px;
            margin-bottom: 1.8rem;
        }
        .type-toggle button {
            flex: 1;
            border: none;
            border-radius: 10px;
            padding: 0.65rem 1rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 700; font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.22s;
            color: #8a9db8;
            background: transparent;
            letter-spacing: 0.01em;
        }
        .type-toggle button.active {
            background: linear-gradient(135deg, #00d4ff 0%, #0066cc 100%);
            color: #fff;
            box-shadow: 0 4px 14px rgba(0, 255, 255, 0.35);
        }
        .type-toggle button i { margin-right: 6px; font-size: 0.95rem; }

        /* Education pills */
        .edu-pills { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.45rem; }
        .edu-pills input[type="radio"] { display: none; }
        .edu-pills label {
            padding: 0.45rem 1rem;
            border-radius: 99px;
            border: 1.5px solid rgba(0, 255, 255, 0.25);
            color: #8a9db8;
            font-family: 'Outfit', sans-serif;
            font-size: 0.83rem; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
            background: rgba(2, 4, 10, 0.75);
            letter-spacing: 0.01em;
        }
        .edu-pills label:hover { border-color: #00ffff; color: #00ffff; }
        .edu-pills input:checked + label {
            background: linear-gradient(135deg, #00d4ff 0%, #0066cc 100%);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0, 255, 255, 0.35);
        }

        /* Section separator */
        .section-sep {
            display: flex; align-items: center; gap: 0.9rem;
            margin: 2rem 0 1.5rem;
        }
        .section-sep span {
            color: #aabcce;
            font-family: 'Outfit', sans-serif;
            font-size: 0.72rem;
            font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em;
            white-space: nowrap;
        }
        .section-sep::before, .section-sep::after {
            content: ''; flex: 1;
            height: 1.5px; background: rgba(0, 255, 255, 0.15);
        }

        /* Submit button */
        .btn-reg-submit {
            background: linear-gradient(135deg, #00d4ff 0%, #0066cc 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-weight: 800; font-size: 1.05rem;
            letter-spacing: 0.01em;
            padding: 0.9rem 2rem;
            width: 100%;
            margin-top: 1.6rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 20px rgba(0, 255, 255, 0.35);
            display: flex; align-items: center; justify-content: center; gap: 0.55rem;
        }
        .btn-reg-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 255, 255, 0.45);
        }
        .btn-reg-submit:active { transform: translateY(0); }

        /* Success note */
        .success-note {
            display: flex; gap: 0.7rem; align-items: flex-start;
            background: rgba(52, 211, 153, 0.08);
            border: 1px solid rgba(52, 211, 153, 0.2);
            border-radius: 12px; padding: 12px 16px;
            color: #e8edf5; font-size: 0.88rem;
            margin-bottom: 1.5rem;
        }
        .success-note i { color: #34d399; font-size: 1.1rem; flex-shrink: 0; }

        /* Fade sections */
        .fade-section { transition: opacity 0.3s, max-height 0.4s; overflow: hidden; }
        .fade-section.hidden { opacity: 0; max-height: 0; pointer-events: none; }
        .fade-section.visible { opacity: 1; max-height: 600px; }
        /* ══ GOATED BG OVERRIDES ══ */
        html.dark-theme body {
            background: #020510 !important;
            background-image: none !important;
        }
        .db-bg {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none; overflow: hidden; display: none;
        }
        html.dark-theme .db-bg { display: block; }
        .db-bg::before {
            content: ''; position: absolute; inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 15% 20%, rgba(0,150,255,0.18) 0%, transparent 55%),
                radial-gradient(ellipse 60% 50% at 85% 10%, rgba(100,0,255,0.14) 0%, transparent 50%),
                radial-gradient(ellipse 70% 55% at 50% 100%, rgba(0,255,220,0.10) 0%, transparent 55%),
                radial-gradient(ellipse 50% 40% at 90% 80%, rgba(0,80,255,0.12) 0%, transparent 50%),
                linear-gradient(160deg,#02060f 0%,#010416 30%,#020820 60%,#010512 100%);
        }
        .db-orb { position:absolute; border-radius:50%; filter:blur(80px); opacity:0; animation:orbDrift 18s ease-in-out infinite; }
        .db-orb-1 { width:520px;height:520px;top:-120px;left:-100px;background:radial-gradient(circle,rgba(0,120,255,0.30) 0%,transparent 70%);animation-delay:0s;animation-duration:20s; }
        .db-orb-2 { width:400px;height:400px;top:10%;right:-80px;background:radial-gradient(circle,rgba(120,0,255,0.22) 0%,transparent 70%);animation-delay:-7s;animation-duration:24s; }
        .db-orb-3 { width:480px;height:480px;bottom:-80px;left:30%;background:radial-gradient(circle,rgba(0,200,255,0.18) 0%,transparent 70%);animation-delay:-13s;animation-duration:22s; }
        .db-orb-4 { width:300px;height:300px;top:45%;right:25%;background:radial-gradient(circle,rgba(60,0,180,0.16) 0%,transparent 70%);animation-delay:-4s;animation-duration:19s; }
        .db-orb-5 { width:350px;height:350px;bottom:10%;right:-50px;background:radial-gradient(circle,rgba(0,255,180,0.12) 0%,transparent 70%);animation-delay:-9s;animation-duration:26s; }
        @keyframes orbDrift {
            0%   { opacity:0.6; transform:translate(0,0) scale(1); }
            25%  { opacity:0.8; transform:translate(30px,-20px) scale(1.05); }
            50%  { opacity:0.55; transform:translate(-20px,30px) scale(0.97); }
            75%  { opacity:0.75; transform:translate(15px,10px) scale(1.03); }
            100% { opacity:0.6; transform:translate(0,0) scale(1); }
        }
        .db-grid {
            position:absolute; inset:0;
            background-image: linear-gradient(rgba(0,200,255,0.035) 1px,transparent 1px), linear-gradient(90deg,rgba(0,200,255,0.035) 1px,transparent 1px);
            background-size:60px 60px;
            mask-image:radial-gradient(ellipse 100% 100% at 50% 50%,black 20%,transparent 80%);
            -webkit-mask-image:radial-gradient(ellipse 100% 100% at 50% 50%,black 20%,transparent 80%);
        }
        .db-particles { position:absolute; inset:0; }
        .db-star { position:absolute; border-radius:50%; background:#ffffff; animation:starTwinkle linear infinite; }
        @keyframes starTwinkle {
            0%,100% { opacity:0.05; transform:scale(1); }
            50%      { opacity:0.55; transform:scale(1.6); }
        }
        .db-topbar-glow {
            position:absolute; top:0; left:0; right:0; height:2px;
            background:linear-gradient(90deg,transparent 0%,rgba(0,200,255,0.7) 30%,rgba(120,0,255,0.7) 70%,transparent 100%);
            animation:topbarGlowPulse 4s ease-in-out infinite;
        }
        @keyframes topbarGlowPulse { 0%,100%{opacity:0.4;} 50%{opacity:1;} }
        ::-webkit-scrollbar{width:6px;height:6px;}
        ::-webkit-scrollbar-track{background:transparent;}
        ::-webkit-scrollbar-thumb{background:rgba(0,255,255,0.2);border-radius:99px;}
        ::-webkit-scrollbar-thumb:hover{background:#00ffff;}
    </style>
</head>
<body>
<!-- ══ GOATED ANIMATED BACKGROUND ══ -->
<div class="db-bg" aria-hidden="true">
    <div class="db-orb db-orb-1"></div>
    <div class="db-orb db-orb-2"></div>
    <div class="db-orb db-orb-3"></div>
    <div class="db-orb db-orb-4"></div>
    <div class="db-orb db-orb-5"></div>
    <div class="db-grid"></div>
    <div class="db-particles" id="dbParticles"></div>
    <div class="db-topbar-glow"></div>
</div>

<!-- Ambient orb decorations -->
<div class="orb-tl" aria-hidden="true"></div>
<div class="orb-br" aria-hidden="true"></div>

{% include 'navbar.html' %}

<div class="page-wrap">
    <div class="inner-col">

        <!-- Back button -->
        <div class="mb-3">
            <a href="/dashboard" class="back-btn-global">
                <i class="bi bi-arrow-left"></i> Back
            </a>
        </div>

        <div class="login-card">

            <!-- Header -->
            <div class="login-header">
                <i class="bi bi-person-gear"></i>
                <h2>Edit Your Profile</h2>
                <p>Keep your profile details up-to-date for accurate evaluations</p>
            </div>

            <!-- Body -->
            <div class="form-body">

                {% if success %}
                <div class="success-note">
                    <i class="bi bi-check-circle-fill"></i>
                    <div>{{ success }}</div>
                </div>
                {% endif %}

                <form method="POST">

                    <!-- Full name -->
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-person"></i> Full Name</label>
                        <input type="text" name="full_name" class="form-control"
                               placeholder="e.g. Pavan Kumar" value="{{ user.full_name }}" required
                               autocomplete="name">
                    </div>

                    <!-- Email: locked -->
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-envelope"></i> Email Address</label>
                        <input type="email" class="form-control locked-field"
                               value="{{ user.email }}" readonly
                               title="Email is locked and cannot be changed">
                    </div>

                    <!-- Gender -->
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-gender-ambiguous"></i> Gender</label>
                        <select name="gender" class="form-select">
                            <option value="">— Select —</option>
                            <option value="Male" {% if user.gender == "Male" %}selected{% endif %}>Male</option>
                            <option value="Female" {% if user.gender == "Female" %}selected{% endif %}>Female</option>
                            <option value="Other" {% if user.gender == "Other" %}selected{% endif %}>Other / Prefer not to say</option>
                        </select>
                    </div>

                    <!-- User type toggle -->
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-person-badge"></i> Profile Type</label>
                        <div class="type-toggle" id="typeToggle">
                            <button type="button" class="{% if user.user_type != 'professional' %}active{% endif %}" id="btn-student" onclick="setType('student')">
                                <i class="bi bi-mortarboard-fill"></i> Student
                            </button>
                            <button type="button" class="{% if user.user_type == 'professional' %}active{% endif %}" id="btn-professional" onclick="setType('professional')">
                                <i class="bi bi-briefcase-fill"></i> Professional
                            </button>
                        </div>
                        <input type="hidden" name="user_type" id="userTypeInput" value="{{ user.user_type or 'student' }}">
                    </div>

                    <!-- Education (Students only) -->
                    <div class="fade-section {% if user.user_type != 'professional' %}visible{% else %}hidden{% endif %}" id="edu-section">
                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-mortarboard"></i> Education Level</label>
                            <div class="edu-pills">
                                <input class="form-check-input" type="radio" name="education" value="School" id="edu1" {% if user.education == "School" %}checked{% endif %}>
                                <label for="edu1">School</label>
                                <input class="form-check-input" type="radio" name="education" value="PU/12th" id="edu2" {% if user.education == "PU/12th" %}checked{% endif %}>
                                <label for="edu2">PU / 12th</label>
                                <input class="form-check-input" type="radio" name="education" value="Degree" id="edu3" {% if user.education == "Degree" %}checked{% endif %}>
                                <label for="edu3">Degree</label>
                                <input class="form-check-input" type="radio" name="education" value="Post Graduate" id="edu4" {% if user.education == "Post Graduate" %}checked{% endif %}>
                                <label for="edu4">Post Graduate</label>
                            </div>
                        </div>

                        <!-- Course and Semester -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label"><i class="bi bi-book"></i> Course / Branch</label>
                                <input type="text" name="course" class="form-control"
                                       value="{{ user.course or '' }}" placeholder="e.g. BCA, B.Tech CSE">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label"><i class="bi bi-calendar3"></i> Semester / Year</label>
                                <input type="text" name="semester" class="form-control"
                                       value="{{ user.semester or '' }}" placeholder="e.g. 6th Sem, 3rd Year">
                            </div>
                        </div>
                    </div>

                    <!-- Professional fields -->
                    <div class="fade-section {% if user.user_type == 'professional' %}visible{% else %}hidden{% endif %}" id="prof-section">
                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-building"></i> Current Designation</label>
                            <input type="text" name="current_designation" class="form-control"
                                   id="designationInput" value="{{ user.current_designation or '' }}" placeholder="e.g. Software Engineer, Product Manager">
                        </div>
                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-clock-history"></i> Years of Experience</label>
                            <input type="number" name="years_of_experience" class="form-control"
                                   id="expInput" value="{{ user.years_of_experience or '' }}" placeholder="e.g. 3" min="0" max="50" step="0.5">
                        </div>
                    </div>

                    <!-- Optional profile enrichment -->
                    <div class="section-sep"><span>Optional — Enrich Your Profile</span></div>

                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-tools"></i> Primary Skills</label>
                        <input type="text" name="skills" class="form-control"
                               value="{{ user.skills or '' }}" placeholder="e.g. Python, React, Machine Learning (comma separated)">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label"><i class="bi bi-github"></i> GitHub / Portfolio URL</label>
                            <input type="url" name="github_url" class="form-control"
                                   value="{{ user.github_url or '' }}" placeholder="https://github.com/username">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label"><i class="bi bi-linkedin"></i> LinkedIn URL</label>
                            <input type="url" name="linkedin_url" class="form-control"
                                   value="{{ user.linkedin_url or '' }}" placeholder="https://linkedin.com/in/username">
                        </div>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn-reg-submit">
                        <i class="bi bi-check-circle"></i> Save Changes
                    </button>
                </form>

            </div><!-- /form-body -->
        </div><!-- /login-card -->

        <p class="text-center mt-4 mb-0 text-muted" style="font-size:0.9rem;">
            <a href="/dashboard" class="text-link"><i class="bi bi-arrow-left me-1"></i>Back</a>
        </p>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function setType(type) {
        document.getElementById('userTypeInput').value = type;

        const eduSection  = document.getElementById('edu-section');
        const profSection = document.getElementById('prof-section');
        const btnStudent  = document.getElementById('btn-student');
        const btnProf     = document.getElementById('btn-professional');

        if (type === 'student') {
            eduSection.classList.replace('hidden','visible');
            profSection.classList.replace('visible','hidden');
            btnStudent.classList.add('active');
            btnProf.classList.remove('active');
            document.getElementById('designationInput').removeAttribute('required');
            document.getElementById('expInput').removeAttribute('required');
        } else {
            eduSection.classList.replace('visible','hidden');
            profSection.classList.replace('hidden','visible');
            btnStudent.classList.remove('active');
            btnProf.classList.add('active');
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        setType('{{ user.user_type or "student" }}');
    });
</script>
<script>
(function(){
    var c=document.getElementById('dbParticles');
    if(!c)return;
    for(var i=0;i<60;i++){
        var s=document.createElement('div');
        s.className='db-star';
        var sz=Math.random()*2+1;
        s.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;animation-duration:'+(Math.random()*4+2)+'s;animation-delay:'+(Math.random()*6)+'s';
        c.appendChild(s);
    }
})();
</script>
</body>
</html>

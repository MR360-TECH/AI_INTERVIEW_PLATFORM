<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #eef2f7, #e4e9f2); }
        .card { border: none; border-radius: 16px; }
    </style>
</head>
<body>
{% include 'navbar.html' %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="mb-0">Edit Profile</h3>
                    <a href="/dashboard" class="back-btn-global">
                        <i class="bi bi-arrow-left"></i> Back
                    </a>
                </div>

                {% if success %}
                <div class="alert alert-success">{{ success }}</div>
                {% endif %}

                <form method="POST">
                    <div class="mb-3">
                        <label>Full Name</label>
                        <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>
                    </div>

                    <div class="mb-3">
                        <label>Email (cannot be changed)</label>
                        <input type="email" class="form-control" value="{{ user.email }}" disabled>
                    </div>

                    <div class="mb-3">
                        <label>Gender</label>
                        <select name="gender" class="form-select">
                            <option value="Male" {% if user.gender == "Male" %}selected{% endif %}>Male</option>
                            <option value="Female" {% if user.gender == "Female" %}selected{% endif %}>Female</option>
                            <option value="Other" {% if user.gender == "Other" %}selected{% endif %}>Other</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label d-block">Education Level</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="education" value="School" id="edu1" {% if user.education == "School" %}checked{% endif %}>
                            <label class="form-check-label" for="edu1">School</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="education" value="PU/12th" id="edu2" {% if user.education == "PU/12th" %}checked{% endif %}>
                            <label class="form-check-label" for="edu2">PU / 12th</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="education" value="Degree" id="edu3" {% if user.education == "Degree" %}checked{% endif %}>
                            <label class="form-check-label" for="edu3">Degree</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="education" value="Post Graduate" id="edu4" {% if user.education == "Post Graduate" %}checked{% endif %}>
                            <label class="form-check-label" for="edu4">Post Graduate</label>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>Course</label>
                            <input type="text" name="course" class="form-control" value="{{ user.course }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Semester</label>
                            <input type="text" name="semester" class="form-control" value="{{ user.semester }}">
                        </div>
                    </div>

                    <button class="btn btn-primary w-100 mt-2">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="dark-theme">
<head>
    <title>Create Account - AI Interview Platform</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign up for the AI Interview Platform. Enter your email to get started.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script>
    (function() {
        document.documentElement.classList.add('dark-theme');
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
    })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #020510 !important;
            background-image: none !important;
        }

        .login-outer-wrap {
            width: 100%;
            padding: 2.5rem 1rem;
            position: relative;
            z-index: 1;
        }

        .steps-indicator {
            display: flex; align-items: center; justify-content: center;
            gap: 0; margin-bottom: 1.5rem;
        }
        .step-dot {
            width: 28px; height: 28px; border-radius: 50%;
            font-size: 0.75rem; font-weight: 800; font-family: 'Outfit', sans-serif;
            display: flex; align-items: center; justify-content: center;
            background: rgba(16,185,129,0.15); color: #10b981;
            border: 2px solid #10b981;
        }
        .step-dot.active { background: #10b981; color: #fff; }
        .step-line {
            width: 36px; height: 2px;
            background: rgba(16,185,129,0.25);
        }
        .step-line.done { background: #10b981; }

        /* ══ GOATED BG OVERRIDES ══ */
        html.dark-theme body {
            background: #020510 !important;
            background-image: none !important;
        }
        .db-bg {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none; overflow: hidden; display: none;
        }
        html.dark-theme .db-bg { display: block; }
        .db-bg::before {
            content: ''; position: absolute; inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 15% 20%, rgba(0, 150, 255, 0.18) 0%, transparent 55%),
                radial-gradient(ellipse 60% 50% at 85% 10%, rgba(100, 0, 255, 0.14) 0%, transparent 50%),
                radial-gradient(ellipse 70% 55% at 50% 100%, rgba(0, 255, 220, 0.10) 0%, transparent 55%),
                radial-gradient(ellipse 50% 40% at 90% 80%, rgba(0, 80, 255, 0.12) 0%, transparent 50%),
                linear-gradient(160deg,#02060f 0%,#010416 30%,#020820 60%,#010512 100__);
        }
        .db-orb { position:absolute; border-radius:50%; filter:blur(80px); opacity:0; animation:orbDrift 18s ease-in-out infinite; }
        .db-orb-1 { width:520px;height:520px;top:-120px;left:-100px;background:radial-gradient(circle,rgba(0,120,255,0.30) 0%,transparent 70%);animation-delay:0s;animation-duration:20s; }
        .db-orb-2 { width:400px;height:400px;top:10%;right:-80px;background:radial-gradient(circle,rgba(120,0,255,0.22) 0%,transparent 70%);animation-delay:-7s;animation-duration:24s; }
        .db-orb-3 { width:480px;height:480px;bottom:-80px;left:30%;background:radial-gradient(circle,rgba(0,200,255,0.18) 0%,transparent 70%);animation-delay:-13s;animation-duration:22s; }
        .db-orb-4 { width:300px;height:300px;top:45%;right:25%;background:radial-gradient(circle,rgba(60,0,180,0.16) 0%,transparent 70%);animation-delay:-4s;animation-duration:19s; }
        .db-orb-5 { width:350px;height:350px;bottom:10%;right:-50px;background:radial-gradient(circle,rgba(0,255,180,0.12) 0%,transparent 70%);animation-delay:-9s;animation-duration:26s; }
        @keyframes orbDrift {
            0%   { opacity:0.6; transform:translate(0,0) scale(1); }
            25%  { opacity:0.8; transform:translate(30px,-20px) scale(1.05); }
            50%  { opacity:0.55; transform:translate(-20px,30px) scale(0.97); }
            75%  { opacity:0.75; transform:translate(15px,10px) scale(1.03); }
            100% { opacity:0.6; transform:translate(0,0) scale(1); }
        }
        .db-grid {
            position:absolute; inset:0;
            background-image: linear-gradient(rgba(0,200,255,0.035) 1px,transparent 1px), linear-gradient(90deg,rgba(0,200,255,0.035) 1px,transparent 1px);
            background-size:60px 60px;
            mask-image:radial-gradient(ellipse 100% 100% at 50% 50%,black 20%,transparent 80%);
            -webkit-mask-image:radial-gradient(ellipse 100% 100% at 50% 50%,black 20%,transparent 80%);
        }
        .db-particles { position:absolute; inset:0; }
        .db-star { position:absolute; border-radius:50%; background:#ffffff; animation:starTwinkle linear infinite; }
        @keyframes starTwinkle {
            0%,100% { opacity:0.05; transform:scale(1); }
            50%      { opacity:0.55; transform:scale(1.6); }
        }
        .db-topbar-glow {
            position:absolute; top:0; left:0; right:0; height:2px;
            background:linear-gradient(90deg,transparent 0%,rgba(0,200,255,0.7) 30%,rgba(120,0,255,0.7) 70%,transparent 100%);
            animation:topbarGlowPulse 4s ease-in-out infinite;
        }
        @keyframes topbarGlowPulse { 0%,100%{opacity:0.4;} 50%{opacity:1;} }
        ::-webkit-scrollbar{width:6px;height:6px;}
        ::-webkit-scrollbar-track{background:transparent;}
        ::-webkit-scrollbar-thumb{background:rgba(0,255,255,0.2);border-radius:99px;}
        ::-webkit-scrollbar-thumb:hover{background:#00ffff;}
    </style>
</head>
<body>
<!-- ══ GOATED ANIMATED BACKGROUND ══ -->
<div class="db-bg" aria-hidden="true">
    <div class="db-orb db-orb-1"></div>
    <div class="db-orb db-orb-2"></div>
    <div class="db-orb db-orb-3"></div>
    <div class="db-orb db-orb-4"></div>
    <div class="db-orb db-orb-5"></div>
    <div class="db-grid"></div>
    <div class="db-particles" id="dbParticles"></div>
    <div class="db-topbar-glow"></div>
</div>
<div class="login-outer-wrap">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7 col-xl-6">
            <div class="mb-3">
                <a href="/login" class="back-btn-global"><i class="bi bi-arrow-left"></i> Back</a>
            </div>
            <div class="login-card">
                <div class="login-header">
                    <i class="bi bi-person-plus-fill"></i>
                    <h2>Create Account</h2>
                    <p>Enter your email - we'll send you a verification code</p>
                </div>

                <div class="form-body">
                    <!-- Step indicator -->
                    <div class="steps-indicator mb-3 d-flex align-items-center justify-content-center gap-2">
                        <div class="step-dot active">1</div>
                        <div class="step-line"></div>
                        <div class="step-dot">2</div>
                        <div class="step-line"></div>
                        <div class="step-dot">3</div>
                        <div class="step-line"></div>
                        <div class="step-dot">4</div>
                    </div>
                    <p class="text-center mb-4 text-muted" style="font-size:0.75rem; font-family:'Outfit',sans-serif; font-weight:600; letter-spacing:0.05em;">
                        EMAIL &nbsp;→&nbsp; OTP &nbsp;→&nbsp; PASSWORD &nbsp;→&nbsp; PROFILE
                    </p>

                    {% if error %}
                    <div class="alert alert-danger d-flex align-items-center gap-2" role="alert">
                        <i class="bi bi-exclamation-circle-fill"></i> {{ error }}
                    </div>
                    {% endif %}

                    {% if has_google_oauth %}
                    <div class="mb-3">
                        <a href="/auth/google" class="btn btn-google w-100 d-flex align-items-center justify-content-center gap-2 py-2">
                            <img src="https://www.google.com/favicon.ico" width="20" height="20" alt="Google">
                            Continue with Google
                        </a>
                    </div>
                    <div class="divider">or continue with email</div>
                    {% endif %}

                    <form method="POST" action="/signup" id="signupForm">
                        <div class="mb-4">
                            <label class="form-label" for="email">Email Address</label>
                            <input type="email" name="email" id="email" class="form-control" required
                                   placeholder="e.g. yourname@gmail.com" autocomplete="email" autofocus>
                        </div>

                        <button type="submit" class="btn btn-login w-100 text-white mb-2">
                            <i class="bi bi-send-fill me-1"></i> Send Verification Code
                        </button>
                    </form>

                    <p class="text-center mt-4 mb-0 text-muted" style="font-size:0.9rem;">
                        Already have an account? <a href="/login" class="text-link">Sign in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function(){
    var c=document.getElementById('dbParticles');
    if(!c)return;
    for(var i=0;i<60;i++){
        var s=document.createElement('div');
        s.className='db-star';
        var sz=Math.random()*2+1;
        s.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;animation-duration:'+(Math.random()*4+2)+'s;animation-delay:'+(Math.random()*6)+'s';
        c.appendChild(s);
    }
})();
</script>
</body>
</html>

services:
  - type: web
    name: ai-interview-platform
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --worker-class gthread --worker-tmp-dir /dev/shm --timeout 120
    envVars:
      - key: DATABASE_URL          # your Neon *pooled* connection string (set it in the Render dashboard)
        sync: false
      - key: APP_BASE_URL          # e.g. https://your-service.onrender.com (used for links inside emails)
        sync: false
      - key: FEEDBACK_TO_EMAIL     # optional: mailbox that receives user feedback (default: MAIL_USERNAME)
        sync: false
      - key: GEMINI_BACKUP_KEYS    # optional: comma-separated keys from other Google projects
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_2FA             # optional: true = admin also enters a code e-mailed to ADMIN_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RENDER
        value: "true"
    disk:
      name: platform-data
      mountPath: /var/data
      sizeGB: 1
